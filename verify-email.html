<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email – HustleCenter</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: #0F172A;
            margin-bottom: 16px;
        }

        p {
            color: #475569;
        }

        .btn {
            display: inline-block;
            background: #D4A373;
            color: #0F172A;
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 16px;
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
</head>

<body>
    <div class="card">
        <h1>Email <span style="color:#D4A373;">Verification</span></h1>
        <p id="message">Verifying your email…</p>
        <a href="login.html" class="btn" id="loginBtn" style="display:none;">Go to Login</a>
    </div>

    <script>
        const API_BASE = 'https://hustlecenter-api.onrender.com';

        async function verifyEmail() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            const messageEl = document.getElementById('message');
            const loginBtn = document.getElementById('loginBtn');

            if (!token) {
                messageEl.textContent = 'Invalid verification link.';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/auth/verify-email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const data = await res.json();

                if (res.ok) {
                    messageEl.textContent = 'Your email has been verified successfully!';
                    loginBtn.style.display = 'inline-block';
                } else {
                    messageEl.textContent = data.error || 'Verification failed. Please try again.';
                }
            } catch (err) {
                messageEl.textContent = 'We couldn\'t verify your email right now. Please try again later.';
            }
        }

        verifyEmail();
    </script>
    <script src="pwa.js"></script>
</body>

</html>
