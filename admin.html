<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – HustleCenter</title>
    <meta name="description" content="HustleCenter admin dashboard. Manage listings, requests, accounts, reports, appeals, stories, and articles.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <style>
        :root {
            --primary: #0F172A;
            --accent: #D4A373;
            --accent-hover: #C8925A;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #475569;
            --border-light: #E2E8F0;
            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font-body); background:var(--bg); color:var(--text-dark); line-height:1.6; }
        a { color:var(--accent); text-decoration:none; }
        .container { max-width:1200px; margin:0 auto; padding:0 24px; }
        h1, h2 { font-family:var(--font-heading); font-weight:700; }
        h1 { font-size:2rem; margin-bottom:24px; }
        h2 { font-size:1.4rem; margin:24px 0 16px; }
        .gold { color:var(--accent); }

        .site-header { background:#fff; border-bottom:1px solid var(--border-light); padding:16px 0; position:sticky; top:0; z-index:100; }
        .header-inner { display:flex; justify-content:space-between; align-items:center; }
        .logo-mark { font-family:var(--font-heading); font-size:1.8rem; font-weight:700; }
        .logo-mark .gold { color:var(--accent); }

        .login-box { background:var(--card-bg); padding:40px; border-radius:var(--radius-md); max-width:400px; margin:80px auto; text-align:center; box-shadow:0 8px 30px rgba(15,23,42,0.08); }
        .login-box input { width:100%; padding:14px 16px; border:2px solid var(--border-light); border-radius:var(--radius-sm); font-size:1rem; margin:16px 0; }
        .login-box button { width:100%; padding:14px; background:var(--accent); border:none; border-radius:50px; font-weight:600; cursor:pointer; font-size:1rem; }
        .login-box button:hover { background:var(--accent-hover); }

        .dashboard { display:none; padding:40px 0; }
        .tabs { display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
        .tab { padding:8px 18px; border:2px solid var(--border-light); border-radius:20px; background:#fff; cursor:pointer; font-size:0.9rem; transition:0.2s; }
        .tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .tab:hover:not(.active) { border-color:var(--accent); }

        .table-wrapper { overflow-x:auto; background:var(--card-bg); border-radius:var(--radius-md); box-shadow:0 8px 30px rgba(15,23,42,0.08); padding:20px; }
        table { width:100%; border-collapse:collapse; font-size:0.85rem; }
        th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border-light); }
        th { background:var(--bg); font-weight:600; }

        .btn-sm { padding:5px 12px; border-radius:16px; font-size:0.75rem; font-weight:600; border:none; cursor:pointer; }
        .btn-approve { background:#D4A373; color:#0F172A; }
        .btn-reject, .btn-delete { background:#dc2626; color:#fff; margin-left:4px; }
        .btn-view { background:#E2E8F0; color:#0F172A; margin-left:4px; }

        .stats-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:16px; margin-bottom:32px; }
        .stat-card { background:var(--card-bg); padding:20px; border-radius:var(--radius-md); box-shadow:0 8px 30px rgba(15,23,42,0.05); text-align:center; }
        .stat-card .stat-num { font-family:var(--font-heading); font-size:2rem; color:var(--accent); }
        .stat-card .stat-label { font-size:0.85rem; color:var(--text-muted); }

        .status-msg { padding:10px; margin:10px 0; border-radius:8px; }
        .status-success { background:#dcfce7; color:#166534; }
        .status-error { background:#fee2e2; color:#991b1b; }

        @media (max-width: 768px) {
            .login-box { margin:40px auto; }
            .stats-row { grid-template-columns:1fr 1fr; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo-mark">Hustle<span class="gold">Center</span> Admin</a>
            <button id="logoutBtn" class="btn-sm" style="background:transparent; border:1px solid #dc2626; color:#dc2626; display:none;" onclick="logout()">Logout</button>
        </div>
    </header>

    <main>
        <div class="container">
            <!-- Login Screen -->
            <div id="loginScreen" class="login-box">
                <h2>Admin <span class="gold">Login</span></h2>
                <input type="password" id="adminKeyInput" placeholder="Admin key" value="">
                <button id="loginBtn">Login</button>
                <p id="loginError" style="color:#dc2626; margin-top:8px; font-size:0.9rem;"></p>
            </div>

            <p style="margin-top:16px; font-size:0.85rem;">
    <a href="admin-links.html">View Admin Quick Links</a>
            </p>

            <!-- Dashboard -->
            <div id="dashboard" class="dashboard">
                <h1>Admin <span class="gold">Dashboard</span></h1>

                <!-- Stats -->
                <div class="stats-row" id="statsRow"></div>

                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" data-tab="listings">Listings</button>
                    <button class="tab" data-tab="requests">Requests</button>
                    <button class="tab" data-tab="accounts">Accounts</button>
                    <button class="tab" data-tab="reports">Reports</button>
                    <button class="tab" data-tab="appeals">Appeals</button>
                    <button class="tab" data-tab="stories">Stories</button>
                    <button class="tab" data-tab="articles">Articles</button>
                </div>
                <div id="statusMsg"></div>
                <div class="table-wrapper" id="tabContent">Loading...</div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = 'https://hustlecenter-api.onrender.com';
        let adminKey = sessionStorage.getItem('adminKey') || '';

        if (adminKey) {
            showDashboard();
            switchTab('listings');
        }

        document.getElementById('loginBtn').addEventListener('click', async function() {
            const keyInput = document.getElementById('adminKeyInput');
            const errorEl = document.getElementById('loginError');
            adminKey = keyInput.value.trim();
            if (!adminKey) return;
            this.disabled = true;
            this.textContent = 'Checking...';
            try {
                const res = await fetch(`${API_BASE}/api/admin/stats`, {
                    headers: { 'x-admin-key': adminKey }
                });
                if (!res.ok) throw new Error('Invalid key');
                sessionStorage.setItem('adminKey', adminKey);
                showDashboard();
                switchTab('listings');
            } catch (err) {
                errorEl.textContent = 'Invalid admin key.';
                adminKey = '';
            } finally {
                this.disabled = false;
                this.textContent = 'Login';
            }
        });

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'block';
            loadStats();
        }

        function logout() {
            sessionStorage.removeItem('adminKey');
            location.reload();
        }

        function authHeaders() {
            return { 'x-admin-key': adminKey, 'Content-Type': 'application/json' };
        }

        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.innerHTML = `<div class="status-msg status-${type}">${msg}</div>`;
            setTimeout(() => el.innerHTML = '', 4000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('statusMsg').innerHTML = '';
            const content = document.getElementById('tabContent');
            switch(tab) {
                case 'listings': loadListings(content); break;
                case 'requests': loadRequests(content); break;
                case 'accounts': loadAccounts(content); break;
                case 'reports': loadReports(content); break;
                case 'appeals': loadAppeals(content); break;
                case 'stories': loadStories(content); break;
                case 'articles': loadArticles(content); break;
            }
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/stats`, { headers: authHeaders() });
                const data = await res.json();
                const stats = [
                    ['Total Users', data.totalUsers],
                    ['Entrepreneurs', data.totalEntrepreneurs],
                    ['Total Listings', data.totalListings],
                    ['Pending', data.pendingListings],
                    ['Approved', data.approvedListings],
                    ['Rejected', data.rejectedListings],
                    ['Requests', data.totalRequests],
                    ['New Reports', data.newReports],
                    ['Pending Appeals', data.pendingAppeals],
                    ['Submitted Stories', data.submittedStories],
                ];
                document.getElementById('statsRow').innerHTML = stats.map(([label, num]) => `
                    <div class="stat-card"><div class="stat-num">${num}</div><div class="stat-label">${label}</div></div>
                `).join('');
            } catch (err) {
                document.getElementById('statsRow').innerHTML = '<p style="color:var(--text-muted);">Unable to load stats.</p>';
            }
        }

        async function loadListings(container) {
            try {
                const [pendingRes, allRes] = await Promise.all([
                    fetch(`${API_BASE}/api/admin/listings/pending`, { headers: authHeaders() }),
                    fetch(`${API_BASE}/api/admin/listings`, { headers: authHeaders() })
                ]);
                const pending = await pendingRes.json();
                const all = await allRes.json();
                const listings = [...pending, ...all.filter(l => l.status !== 'pending')]; // combine unique

                if (listings.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No listings.</p>';
                    return;
                }
                let html = '<table><tr><th>Business</th><th>Category</th><th>Location</th><th>Status</th><th>Date</th><th>Action</th></tr>';
                listings.forEach(l => {
                    const statusClass = l.status === 'approved' ? 'approved' : l.status === 'pending' ? 'pending' : l.status === 'rejected' ? 'rejected' : 'suspended';
                    html += `<tr>
                        <td>${l.businessName}</td><td>${l.category}</td><td>${l.serviceArea}</td>
                        <td><span class="status-badge status-${statusClass}">${l.status}</span></td>
                        <td>${new Date(l.createdAt).toLocaleDateString()}</td>
                        <td>
                            <button class="btn-sm btn-view" data-id="${l._id}">View</button>
                            ${l.status === 'pending' ? `<button class="btn-sm btn-approve" data-id="${l._id}">Approve</button><button class="btn-sm btn-reject" data-id="${l._id}">Reject</button>` : ''}
                            ${l.status === 'approved' ? `<button class="btn-sm btn-reject" data-id="${l._id}">Suspend</button>` : ''}
                        </td>
                    </tr>`;
                });
                html += '</table>';
                container.innerHTML = html;

                container.querySelectorAll('.btn-view').forEach(b => b.addEventListener('click', () => viewListing(b.dataset.id)));
                container.querySelectorAll('.btn-approve').forEach(b => b.addEventListener('click', () => approveListing(b.dataset.id)));
                container.querySelectorAll('.btn-reject').forEach(b => b.addEventListener('click', () => rejectListing(b.dataset.id)));
            } catch (err) {
                container.innerHTML = '<p style="color:#dc2626; text-align:center;">Error loading listings.</p>';
            }
        }

        async function viewListing(id) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/listings/${id}`, { headers: authHeaders() });
                const listing = await res.json();
                if (!res.ok) throw new Error(listing.error || 'Failed');
                const details = `
                    <p><strong>Business:</strong> ${listing.businessName}</p>
                    <p><strong>Description:</strong> ${listing.description}</p>
                    <p><strong>Contact:</strong> ${listing.contactName} / ${listing.phone} / ${listing.email}</p>
                    <p><strong>Location:</strong> ${listing.serviceArea}</p>
                    <p><strong>Status:</strong> ${listing.status}</p>
                    ${listing.profileImage ? `<img src="${listing.profileImage}" alt="Profile" style="max-width:100px;">` : ''}
                `;
                alert(details);
            } catch (err) {
                alert(err.message);
            }
        }

        async function approveListing(id) {
            if (!confirm('Approve this listing?')) return;
            await fetch(`${API_BASE}/api/admin/listings/${id}/approve`, { method: 'PUT', headers: authHeaders() });
            showStatus('✅ Listing approved!', 'success');
            loadListings(document.getElementById('tabContent'));
            loadStats();
        }

        async function rejectListing(id) {
            if (!confirm('Reject/suspend this listing?')) return;
            await fetch(`${API_BASE}/api/admin/listings/${id}/reject`, { method: 'PUT', headers: authHeaders() });
            showStatus('Listing rejected/suspended.', 'success');
            loadListings(document.getElementById('tabContent'));
            loadStats();
        }

        async function loadRequests(container) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/requests`, { headers: authHeaders() });
                const data = await res.json();
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No requests.</p>';
                    return;
                }
                let html = '<table><tr><th>Customer</th><th>Provider</th><th>Service</th><th>Message</th><th>Status</th><th>Date</th><th>Action</th></tr>';
                data.forEach(r => {
                    html += `<tr>
                        <td>${r.customerPhone}</td><td>${r.listing ? r.listing.businessName : ''}</td><td>${r.serviceRequested}</td>
                        <td>${r.message || '—'}</td><td>${r.status}</td><td>${new Date(r.createdAt).toLocaleString()}</td>
                        <td><button class="btn-sm btn-view" data-id="${r._id}">Update Status</button></td>
                    </tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
                container.querySelectorAll('.btn-view').forEach(b => b.addEventListener('click', () => updateRequestStatus(b.dataset.id, r.status)));
            } catch (err) {
                container.innerHTML = '<p style="color:#dc2626; text-align:center;">Error loading requests.</p>';
            }
        }

        async function updateRequestStatus(id, currentStatus) {
            const statuses = ['new', 'viewed', 'contacted', 'completed', 'cancelled', 'closed'];
            const status = prompt(`Current status: ${currentStatus}. Enter new status:\n${statuses.join(', ')}`, currentStatus);
            if (!status) return;
            const res = await fetch(`${API_BASE}/api/admin/requests/${id}`, {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify({ status })
            });
            const data = await res.json();
            if (res.ok) {
                showStatus('Request updated', 'success');
                loadRequests(document.getElementById('tabContent'));
            } else {
                showStatus(data.error || 'Update failed', 'error');
            }
        }

        async function loadAccounts(container) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/users`, { headers: authHeaders() });
                const data = await res.json();
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No accounts.</p>';
                    return;
                }
                let html = '<table><tr><th>Username</th><th>Email</th><th>Role</th><th>Verified</th><th>Consent</th><th>Status</th><th>Date</th><th>Action</th></tr>';
                data.forEach(u => {
                    const consent = u.consent && (u.consent.termsAccepted || u.consent.privacyAccepted) ? 'Yes' : 'No';
                    html += `<tr>
                        <td>${u.username}</td><td>${u.email}</td><td>${u.roles.join(', ')}</td>
                        <td>${u.verified ? 'Yes' : 'No'}</td><td>${consent}</td><td>${u.status}</td>
                        <td>${new Date(u.createdAt).toLocaleDateString()}</td>
                        <td><button class="btn-sm btn-delete" data-id="${u._id}">Delete</button></td>
                    </tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
                container.querySelectorAll('.btn-delete').forEach(b => b.addEventListener('click', () => deleteUser(b.dataset.id)));
            } catch (err) {
                container.innerHTML = '<p style="color:#dc2626; text-align:center;">Error loading accounts.</p>';
            }
        }

        async function deleteUser(id) {
            if (!confirm('Delete this account and all associated data?')) return;
            const res = await fetch(`${API_BASE}/api/admin/users/${id}`, { method: 'DELETE', headers: authHeaders() });
            if (res.ok) {
                showStatus('Account deleted.', 'success');
                loadAccounts(document.getElementById('tabContent'));
                loadStats();
            } else {
                showStatus('Failed to delete account.', 'error');
            }
        }

        async function loadReports(container) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/reports`, { headers: authHeaders() });
                const data = await res.json();
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No reports.</p>';
                    return;
                }
                let html = '<table><tr><th>Type</th><th>Explanation</th><th>Status</th><th>Admin Notes</th><th>Date</th><th>Action</th></tr>';
                data.forEach(r => {
                    html += `<tr>
                        <td>${r.problemType}</td><td>${r.explanation.substring(0, 50)}…</td><td>${r.status}</td>
                        <td>${r.adminNotes || '—'}</td><td>${new Date(r.createdAt).toLocaleDateString()}</td>
                        <td><button class="btn-sm btn-view" data-id="${r._id}">Update</button></td>
                    </tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
                container.querySelectorAll('.btn-view').forEach(b => b.addEventListener('click', () => updateReport(b.dataset.id, r.status, r.adminNotes)));
            } catch (err) {
                container.innerHTML = '<p style="color:#dc2626; text-align:center;">Error loading reports.</p>';
            }
        }

        async function updateReport(id, currentStatus, currentNotes) {
            const status = prompt(`Enter status:\n${['submitted', 'under-review', 'resolved', 'closed'].join(', ')}`, currentStatus);
            if (!status) return;
            const notes = prompt('Admin notes:', currentNotes || '');
            const res = await fetch(`${API_BASE}/api/admin/reports/${id}`, {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify({ status, adminNotes: notes })
            });
            if (res.ok) {
                showStatus('Report updated', 'success');
                loadReports(document.getElementById('tabContent'));
            } else {
                const data = await res.json();
                showStatus(data.error || 'Failed', 'error');
            }
        }

        async function loadAppeals(container) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/appeals`, { headers: authHeaders() });
                const data = await res.json();
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No appeals.</p>';
                    return;
                }
                let html = '<table><tr><th>Name</th><th>Reason</th><th>Status</th><th>Admin Notes</th><th>Date</th><th>Action</th></tr>';
                data.forEach(a => {
                    html += `<tr>
                        <td>${a.name}</td><td>${a.reason.substring(0, 50)}…</td><td>${a.status}</td>
                        <td>${a.adminNotes || '—'}</td><td>${new Date(a.createdAt).toLocaleDateString()}</td>
                        <td><button class="btn-sm btn-view" data-id="${a._id}">Update</button></td>
                    </tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
                container.querySelectorAll('.btn-view').forEach(b => b.addEventListener('click', () => updateAppeal(b.dataset.id, a.status, a.adminNotes)));
            } catch (err) {
                container.innerHTML = '<p style="color:#dc2626; text-align:center;">Error loading appeals.</p>';
            }
        }

        async function updateAppeal(id, currentStatus, currentNotes) {
            const status = prompt(`Enter status:\n${['submitted', 'under-review', 'approved', 'declined', 'closed'].join(', ')}`, currentStatus);
            if (!status) return;
            const notes = prompt('Admin notes:', currentNotes || '');
            const res = await fetch(`${API_BASE}/api/admin/appeals/${id}`, {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify({ status, adminNotes: notes })
            });
            if (res.ok) {
                showStatus('Appeal updated', 'success');
                loadAppeals(document.getElementById('tabContent'));
            } else {
                const data = await res.json();
                showStatus(data.error || 'Failed', 'error');
            }
        }

        async function loadStories(container) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/stories`, { headers: authHeaders() });
                const data = await res.json();
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No stories.</p>';
                    return;
                }
                let html = '<table><tr><th>Title</th><th>Type</th><th>Status</th><th>Date</th><th>Action</th></tr>';
                data.forEach(s => {
                    html += `<tr>
                        <td>${s.title}</td><td>${s.submissionType}</td><td>${s.status}</td>
                        <td>${new Date(s.createdAt).toLocaleDateString()}</td>
                        <td>
                            <button class="btn-sm btn-view" data-id="${s._id}">Update</button>
                            ${s.status !== 'approved' ? `<button class="btn-sm btn-approve" data-id="${s._id}">Approve & Publish</button>` : ''}
                            ${s.status !== 'rejected' ? `<button class="btn-sm btn-reject" data-id="${s._id}">Reject</button>` : ''}
                        </td>
                    </tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
                container.querySelectorAll('.btn-view').forEach(b => b.addEventListener('click', () => updateStory(b.dataset.id, s.status, s.adminNotes)));
                container.querySelectorAll('.btn-approve').forEach(b => b.addEventListener('click', () => approveStory(b.dataset.id)));
                container.querySelectorAll('.btn-reject').forEach(b => b.addEventListener('click', () => rejectStory(b.dataset.id)));
            } catch (err) {
                container.innerHTML = '<p style="color:#dc2626; text-align:center;">Error loading stories.</p>';
            }
        }

        async function updateStory(id, currentStatus, currentNotes) {
            const status = prompt(`Enter status:\n${['submitted', 'under-review', 'approved', 'rejected', 'published'].join(', ')}`, currentStatus);
            if (!status) return;
            const notes = prompt('Admin notes:', currentNotes || '');
            const res = await fetch(`${API_BASE}/api/admin/stories/${id}`, {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify({ status, adminNotes: notes })
            });
            if (res.ok) {
                showStatus('Story updated', 'success');
                loadStories(document.getElementById('tabContent'));
            } else {
                const data = await res.json();
                showStatus(data.error || 'Failed', 'error');
            }
        }

        async function approveStory(id) {
            if (!confirm('Approve and publish as article?')) return;
            const res = await fetch(`${API_BASE}/api/admin/stories/${id}/approve`, { method: 'PUT', headers: authHeaders() });
            const data = await res.json();
            if (res.ok) {
                showStatus('Story approved and published.', 'success');
                loadStories(document.getElementById('tabContent'));
                loadStats();
            } else {
                showStatus(data.error || 'Failed', 'error');
            }
        }

        async function rejectStory(id) {
            if (!confirm('Reject this story?')) return;
            const res = await fetch(`${API_BASE}/api/admin/stories/${id}/reject`, { method: 'PUT', headers: authHeaders() });
            if (res.ok) {
                showStatus('Story rejected.', 'success');
                loadStories(document.getElementById('tabContent'));
            } else {
                showStatus('Failed', 'error');
            }
        }

        async function loadArticles(container) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/articles`, { headers: authHeaders() });
                if (!res.ok) throw new Error('Endpoint missing');
                const data = await res.json();
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No articles.</p>';
                    return;
                }
                let html = '<table><tr><th>Title</th><th>Status</th><th>Date</th><th>Action</th></tr>';
                data.forEach(article => {
                    html += `<tr>
                        <td>${article.title}</td><td>${article.status}</td>
                        <td>${article.publishedAt ? new Date(article.publishedAt).toLocaleDateString() : '—'}</td>
                        <td>
                            <button class="btn-sm btn-view" data-id="${article._id}">Edit</button>
                            <button class="btn-sm btn-delete" data-id="${article._id}">Delete</button>
                        </td>
                    </tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
                container.querySelectorAll('.btn-view').forEach(b => b.addEventListener('click', () => editArticle(b.dataset.id)));
                container.querySelectorAll('.btn-delete').forEach(b => b.addEventListener('click', () => deleteArticle(b.dataset.id)));
            } catch (err) {
                container.innerHTML = '<p style="color:#dc2626; text-align:center;">Articles endpoint not available.</p>';
            }
        }

        async function editArticle(id) {
            // Very simple: prompt for title/content (not a full editor)
            const title = prompt('New title:');
            if (!title) return;
            const content = prompt('New content (HTML allowed):');
            if (!content) return;
            const res = await fetch(`${API_BASE}/api/admin/articles/${id}`, {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify({ title, content })
            });
            if (res.ok) {
                showStatus('Article updated', 'success');
                loadArticles(document.getElementById('tabContent'));
            } else {
                const data = await res.json();
                showStatus(data.error || 'Failed', 'error');
            }
        }

        async function deleteArticle(id) {
            if (!confirm('Delete this article?')) return;
            const res = await fetch(`${API_BASE}/api/admin/articles/${id}`, { method: 'DELETE', headers: authHeaders() });
            if (res.ok) {
                showStatus('Article deleted', 'success');
                loadArticles(document.getElementById('tabContent'));
            } else {
                showStatus('Failed', 'error');
            }
        }
    </script>
</body>
</html>
